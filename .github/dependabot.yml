version: 2
updates:
  # Go-модули: все обновления одной PR в неделю, чтобы не плодить по PR на каждую
  # транзитивную зависимость.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "зависимости"
    groups:
      go:
        patterns: ["*"]

  # Версии actions в .github/workflows (закреплены по SHA).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "зависимости"
    groups:
      actions:
        patterns: ["*"]

  # Базовые образы в Dockerfile (закреплены по digest).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "зависимости"
